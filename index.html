<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Coach AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:#f5f7ff;
  color:#172033;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* =========================
   HEADER
========================= */

.header{
  height:70px;
  background:white;
  border-bottom:1px solid #e7eaf2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.logo span{
  color:#735cff;
}

.headerButton{
  border:0;
  border-radius:12px;
  padding:10px 16px;
  background:#735cff;
  color:white;
  font-weight:800;
}

/* =========================
   MAIN
========================= */

.main{
  max-width:1100px;
  margin:0 auto;
  padding:30px 18px 50px;
}

.hero{
  background:white;
  border-radius:24px;
  padding:30px;
  box-shadow:0 10px 35px rgba(40,50,90,.07);
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 8px;
  font-size:30px;
}

.hero p{
  margin:0;
  color:#69738a;
}

/* =========================
   SUBJECT
========================= */

.subjects{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.subject{
  border:1px solid #e4e7f0;
  background:white;
  border-radius:16px;
  padding:16px;
  font-weight:800;
}

.subject.active{
  background:#735cff;
  color:white;
  border-color:#735cff;
}

/* =========================
   CHAT
========================= */

.chatCard{
  background:white;
  border-radius:24px;
  box-shadow:0 10px 35px rgba(40,50,90,.07);
  overflow:hidden;
}

.chatHeader{
  padding:18px 20px;
  border-bottom:1px solid #edf0f5;
  font-weight:900;
}

.chatMessages{
  height:430px;
  overflow-y:auto;
  padding:20px;
}

.bubble{
  max-width:80%;
  padding:12px 15px;
  border-radius:17px;
  margin-bottom:12px;
  white-space:pre-wrap;
  line-height:1.6;
}

.bubble.user{
  margin-left:auto;
  background:#735cff;
  color:white;
  border-bottom-right-radius:5px;
}

.bubble.ai{
  background:#f0f2f8;
  color:#20283a;
  border-bottom-left-radius:5px;
}

.chatInputArea{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid #edf0f5;
}

.chatInput{
  flex:1;
  border:1px solid #dfe3ec;
  border-radius:14px;
  padding:13px;
  outline:none;
}

.sendButton{
  border:0;
  border-radius:14px;
  padding:0 20px;
  background:#735cff;
  color:white;
  font-weight:900;
}

/* =========================
   INFO
========================= */

.infoGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  margin-top:20px;
}

.infoCard{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(40,50,90,.05);
}

.infoCard h3{
  margin-top:0;
}

/* =========================
   OVERLAY
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(10,15,30,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal{
  width:min(520px,100%);
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:24px;
  padding:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.2);
}

.modalLogo{
  font-size:22px;
  font-weight:900;
  margin-bottom:15px;
}

.modalLogo span{
  color:#735cff;
}

.modal h1{
  margin:0 0 10px;
}

.modalIntro{
  color:#687287;
  margin-bottom:20px;
  line-height:1.6;
}

.check{
  display:flex;
  gap:10px;
  align-items:flex-start;
  margin:14px 0;
  line-height:1.5;
  font-size:14px;
}

.check input{
  width:18px;
  height:18px;
  margin-top:2px;
}

.modalButton{
  width:100%;
  padding:14px;
  border:0;
  border-radius:14px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,#6389ff,#9864ef);
  margin-top:10px;
}

.linkButton{
  margin-top:10px;
  padding:10px;
  width:100%;
  border:0;
  background:transparent;
  color:#735cff;
}

.form{
  display:grid;
  gap:15px;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-weight:800;
}

.field input,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #dfe3ec;
  border-radius:12px;
  outline:none;
}

.formError{
  color:#e5484d;
  font-size:14px;
  margin-top:8px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .subjects{
    grid-template-columns:repeat(2,1fr);
  }

  .infoGrid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:24px;
  }

  .chatMessages{
    height:380px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Study <span>Coach AI</span>
  </div>

  <button
    class="headerButton"
    onclick="logout()"
  >
    ログアウト
  </button>

</header>

<main class="main">

  <section class="hero">

    <h1 id="welcomeText">
      今日も一緒に勉強しよう📚
    </h1>

    <p>
      AI勉強コーチに質問して、分からないところを一緒に解決しよう。
    </p>

  </section>

  <section class="subjects">

    <button
      class="subject active"
      onclick="selectSubject(this,'数学')"
    >
      📐 数学
    </button>

    <button
      class="subject"
      onclick="selectSubject(this,'英語')"
    >
      🇺🇸 英語
    </button>

    <button
      class="subject"
      onclick="selectSubject(this,'国語')"
    >
      📖 国語
    </button>

    <button
      class="subject"
      onclick="selectSubject(this,'理科')"
    >
      🔬 理科
    </button>

  </section>

  <section class="chatCard">

    <div class="chatHeader">
      AI勉強コーチ
      <span id="subjectText">数学</span>
    </div>

    <div
      id="chatMessages"
      class="chatMessages"
    >

      <div class="bubble ai">
        こんにちは！😊
        分からない問題や勉強について何でも聞いてね！
      </div>

    </div>

    <div class="chatInputArea">

      <input
        id="chatInput"
        class="chatInput"
        type="text"
        placeholder="AIに質問してみよう..."
        onkeydown="handleKey(event)"
      >

      <button
        class="sendButton"
        onclick="sendMessage()"
      >
        送信
      </button>

    </div>

  </section>

  <section class="infoGrid">

    <div class="infoCard">
      <h3>⏱️ 勉強時間</h3>
      <p>
        今日の勉強時間：
        <strong id="studyTime">0分</strong>
      </p>

      <button
        class="headerButton"
        onclick="toggleStudy()"
      >
        勉強開始 / 停止
      </button>
    </div>

    <div class="infoCard">
      <h3>👤 アカウント</h3>
      <p id="accountInfo">
        アカウント情報を読み込み中...
      </p>
    </div>

  </section>

</main>


<!-- =========================
     CONSENT
========================= -->

<div
  id="consentScreen"
  class="overlay"
>

  <div class="modal">

    <div class="modalLogo">
      Study <span>Coach AI</span>
    </div>

    <h1>はじめに確認してください</h1>

    <div class="modalIntro">
      Study Coach AIを利用する前に、以下の内容を確認してください。
    </div>

    <label class="check">
      <input
        type="checkbox"
        id="termsCheck"
      >

      <span>
        利用規約を確認し、サービスの利用条件に同意します。
      </span>
    </label>

    <label class="check">
      <input
        type="checkbox"
        id="privacyCheck"
      >

      <span>
        個人情報の利用目的・取り扱いについて確認しました。
      </span>
    </label>

    <label class="check">
      <input
        type="checkbox"
        id="aiDataCheck"
      >

      <span>
        質問内容などのデータがAI機能の提供に利用されることを確認しました。
      </span>
    </label>

    <div
      id="consentError"
      class="formError"
    ></div>

    <button
      id="consentButton"
      class="modalButton"
      onclick="acceptConsent()"
    >
      同意してアカウント作成へ
    </button>

  </div>

</div>


<!-- =========================
     ACCOUNT
========================= -->

<div
  id="accountScreen"
  class="overlay hidden"
>

  <div class="modal">

    <div class="modalLogo">
      Study <span>Coach AI</span>
    </div>

    <h1>アカウントを作成 👤</h1>

    <div class="modalIntro">
      学習記録を管理するための情報を入力してください。
    </div>

    <div class="form">

      <div class="field">

        <label>ニックネーム</label>

        <input
          id="nickname"
          type="text"
          maxlength="30"
          placeholder="例：ゆうせい"
        >

      </div>

      <div class="field">

        <label>年齢</label>

        <input
          id="age"
          type="number"
          min="1"
          max="120"
          placeholder="例：16"
        >

      </div>

      <div class="field">

        <label>
          性別
          <span>（任意）</span>
        </label>

        <select id="gender">

          <option value="">
            回答しない
          </option>

          <option value="male">
            男性
          </option>

          <option value="female">
            女性
          </option>

          <option value="other">
            その他
          </option>

        </select>

      </div>

      <button
        class="modalButton"
        onclick="createAccount()"
      >
        アカウントを作成
      </button>

      <div
        id="accountError"
        class="formError"
      ></div>

    </div>

  </div>

</div>


<script>

/* =========================
   SETTINGS
========================= */

const WORKER_URL =
  "https://study-coach-ai.6y7ps8znts.workers.dev";


/* =========================
   CONSENT
========================= */

const checks = [
  "termsCheck",
  "privacyCheck",
  "aiDataCheck"
];

function updateConsentButton(){

  const allChecked =
    checks.every(id => {

      const checkbox =
        document.getElementById(id);

      return checkbox &&
             checkbox.checked;

    });

  const button =
    document.getElementById(
      "consentButton"
    );

  if(button){
    button.disabled =
      !allChecked;
  }

}

checks.forEach(id => {

  const checkbox =
    document.getElementById(id);

  if(checkbox){

    checkbox.addEventListener(
      "change",
      updateConsentButton
    );

  }

});


function acceptConsent(){

  const allChecked =
    checks.every(id => {

      const checkbox =
        document.getElementById(id);

      return checkbox &&
             checkbox.checked;

    });

  if(!allChecked){

    document.getElementById(
      "consentError"
    ).textContent =
      "3つすべてにチェックを入れてください。";

    return;

  }

  localStorage.setItem(
    "studyCoachConsent",
    "accepted"
  );

  document
    .getElementById("consentScreen")
    .classList.add("hidden");

  showCreateAccount();

}


/* =========================
   ACCOUNT
========================= */

function showCreateAccount(){

  document
    .getElementById("accountScreen")
    .classList.remove("hidden");

}


function createAccount(){

  const nickname =
    document
      .getElementById("nickname")
      .value.trim();

  const age =
    document
      .getElementById("age")
      .value;

  const gender =
    document
      .getElementById("gender")
      .value;

  const error =
    document.getElementById(
      "accountError"
    );

  if(!nickname){

    error.textContent =
      "ニックネームを入力してください。";

    return;

  }

  if(!age){

    error.textContent =
      "年齢を入力してください。";

    return;

  }

  localStorage.setItem(
    "studyCoachUser",
    JSON.stringify({
      nickname,
      age,
      gender
    })
  );

  localStorage.setItem(
    "studyCoachLoggedIn",
    "true"
  );

  document
    .getElementById("accountScreen")
    .classList.add("hidden");

  loadUser();

}


function loadUser(){

  const raw =
    localStorage.getItem(
      "studyCoachUser"
    );

  if(!raw)return;

  const user =
    JSON.parse(raw);

  document.getElementById(
    "welcomeText"
  ).textContent =
    `${user.nickname}さん、今日も勉強しよう📚`;

  document.getElementById(
    "accountInfo"
  ).textContent =
    `${user.nickname} / ${user.age}歳`;

}


/* =========================
   AI CHAT
========================= */

function handleKey(event){

  if(event.key === "Enter"){
    sendMessage();
  }

}


async function sendMessage(){

  const input =
    document.getElementById(
      "chatInput"
    );

  const text =
    input.value.trim();

  if(!text)return;

  addMessage(
    text,
    "user"
  );

  input.value = "";

  const thinking =
    addMessage(
      "考え中...🤔",
      "ai"
    );

  try{

    const response =
      await fetch(
        WORKER_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:text
          })
        }
      );

    const data =
      await response.json();

    thinking.remove();

    if(!response.ok){

      console.error(
        "Worker error:",
        data
      );

      addMessage(
        "😭 AIとの接続でエラーが起きました。\n" +
        "エラーコード: " +
        response.status,
        "ai"
      );

      return;

    }

    addMessage(
      data.answer ||
      "AIから回答を受け取れませんでした。",
      "ai"
    );

  }catch(error){

    console.error(error);

    thinking.remove();

    addMessage(
      "😭 AIとの接続に失敗しました。",
      "ai"
    );

  }

}


function addMessage(
  text,
  type
){

  const chat =
    document.getElementById(
      "chatMessages"
    );

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble " + type;

  bubble.textContent =
    text;

  chat.appendChild(
    bubble
  );

  chat.scrollTop =
    chat.scrollHeight;

  return bubble;

}


/* =========================
   SUBJECT
========================= */

function selectSubject(
  button,
  subject
){

  document
    .querySelectorAll(".subject")
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  document.getElementById(
    "subjectText"
  ).textContent =
    subject;

}


/* =========================
   STUDY TIMER
========================= */

let studying = false;

let studyMinutes =
  Number(
    localStorage.getItem(
      "studyMinutes"
    ) || 0
  );

document.getElementById(
  "studyTime"
).textContent =
  studyMinutes + "分";


function toggleStudy(){

  studying =
    !studying;

  addMessage(
    studying
      ? "⏱️ 勉強スタート！集中タイム開始🔥"
      : "⏸️ 勉強タイムを停止しました。お疲れさま！",
    "ai"
  );

}


setInterval(
  () => {

    if(!studying)return;

    studyMinutes++;

    localStorage.setItem(
      "studyMinutes",
      studyMinutes
    );

    document.getElementById(
      "studyTime"
    ).textContent =
      studyMinutes + "分";

  },
  60000
);


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "studyCoachLoggedIn"
  );

  location.reload();

}


/* =========================
   STARTUP
========================= */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    loadUser();

    const consent =
      localStorage.getItem(
        "studyCoachConsent"
      );

    const loggedIn =
      localStorage.getItem(
        "studyCoachLoggedIn"
      );

    if(consent !== "accepted"){

      document
        .getElementById(
          "consentScreen"
        )
        .classList.remove(
          "hidden"
        );

    }
    else if(!loggedIn){

      showCreateAccount();

    }

  }
);

</script>

</body>
</html>
