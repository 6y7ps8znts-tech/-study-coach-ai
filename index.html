<script>

const WORKER_URL =
  "https://study-coach-ai.6y7ps8znts.workers.dev";


/* =========================
   STUDY CONTENT
========================= */

let studyContent = {
  grade: "1",
  subject: "",
  unit: ""
};


/* =========================
   AUTH
========================= */

function showLogin(){

  document
    .getElementById("registerForm")
    .classList.add("hidden");

  document
    .getElementById("verifyForm")
    .classList.add("hidden");

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

  document
    .getElementById("authTitle")
    .textContent = "ログイン";

}


function showRegister(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("verifyForm")
    .classList.add("hidden");

  document
    .getElementById("registerForm")
    .classList.remove("hidden");

  document
    .getElementById("authTitle")
    .textContent =
    "Study Coachへようこそ";

}


function guestLogin(){

  localStorage.setItem(
    "studyCoachLoggedIn",
    "guest"
  );

  localStorage.setItem(
    "studyCoachName",
    "ゲスト"
  );

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  loadUser();

}


async function register(){

  const name =
    document
      .getElementById("registerName")
      .value
      .trim();

  const email =
    document
      .getElementById("registerEmail")
      .value
      .trim();

  const age =
    Number(
      document
        .getElementById("registerAge")
        .value
    );

  const grade =
    document
      .getElementById("registerGrade")
      .value;

  if(!name || !email || !age){

    alert(
      "名前・メールアドレス・年齢を入力してください。"
    );

    return;
  }

  const checks = [
    "termsCheck",
    "privacyCheck",
    "aiDataCheck"
  ];

  if(
    !checks.every(
      id =>
      document
        .getElementById(id)
        .checked
    )
  ){

    alert(
      "3つすべての同意が必要です。"
    );

    return;
  }

  try{

    const response =
      await fetch(
        `${WORKER_URL}/api/register`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              name,
              email,
              age,
              grade
            })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      alert(
        data.error ||
        "アカウント作成に失敗しました。"
      );

      return;
    }

    localStorage.setItem(
      "pendingEmail",
      email
    );

    localStorage.setItem(
      "studyCoachName",
      name
    );

    document
      .getElementById("registerForm")
      .classList.add("hidden");

    document
      .getElementById("verifyForm")
      .classList.remove("hidden");

    document
      .getElementById("authTitle")
      .textContent =
      "メール認証";

    alert(
      "認証コードを送信しました。"
    );

  }catch(error){

    console.error(error);

    alert(
      "サーバーに接続できませんでした。"
    );

  }

}


async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  if(!email){

    alert(
      "メールアドレスを入力してください。"
    );

    return;
  }

  try{

    const response =
      await fetch(
        `${WORKER_URL}/api/login`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              email
            })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      alert(
        data.error ||
        "ログインコードを送信できませんでした。"
      );

      return;
    }

    localStorage.setItem(
      "pendingEmail",
      email
    );

    document
      .getElementById("loginForm")
      .classList.add("hidden");

    document
      .getElementById("verifyForm")
      .classList.remove("hidden");

    document
      .getElementById("authTitle")
      .textContent =
      "ログイン認証";

    alert(
      "ログインコードを送信しました。"
    );

  }catch(error){

    console.error(error);

    alert(
      "サーバーに接続できませんでした。"
    );

  }

}


async function verifyLoginCode(){

  const email =
    localStorage.getItem(
      "pendingEmail"
    );

  const code =
    document
      .getElementById("verifyCodeInput")
      .value
      .trim();

  if(!email || !code){

    alert(
      "認証コードを入力してください。"
    );

    return;
  }

  try{

    const response =
      await fetch(
        `${WORKER_URL}/api/verify`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              email,
              code
            })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      alert(
        data.error ||
        "認証に失敗しました。"
      );

      return;
    }

    localStorage.setItem(
      "studyCoachLoggedIn",
      "true"
    );

    localStorage.removeItem(
      "pendingEmail"
    );

    document
      .getElementById("authScreen")
      .classList.add("hidden");

    loadUser();

  }catch(error){

    console.error(error);

    alert(
      "認証サーバーに接続できませんでした。"
    );

  }

}


function logout(){

  localStorage.removeItem(
    "studyCoachLoggedIn"
  );

  location.reload();

}


/* =========================
   USER
========================= */

function loadUser(){

  const name =
    localStorage.getItem(
      "studyCoachName"
    ) ||
    "ゲスト";

  document
    .getElementById("headerUserName")
    .textContent =
    name;

  document
    .getElementById("welcomeText")
    .textContent =
    `${name}さん、今日の学習を始めましょう。`;

}


/* =========================
   STUDY CONTENT
========================= */

function setStudyContent(){

  const grade =
    document
      .getElementById("studyGrade")
      .value;

  const subject =
    document
      .getElementById("studySubject")
      .value;

  const unit =
    document
      .getElementById("studyUnit")
      .value
      .trim();

  if(!subject){

    alert(
      "教科を選択してください。"
    );

    return;
  }

  if(!unit){

    alert(
      "今勉強している単元を入力してください。"
    );

    return;
  }

  studyContent = {
    grade,
    subject,
    unit
  };

  localStorage.setItem(
    "studyCoachContent",
    JSON.stringify(
      studyContent
    )
  );

  document
    .getElementById("currentMode")
    .textContent =
    `${subject}モード`;

  document
    .getElementById("currentSubject")
    .textContent =
    `${subject} / ${unit}`;

  document
    .getElementById("studyContentStatus")
    .textContent =
    `SC設定済み：高校${grade}・${subject}・${unit}`;

  addAIMessage(
    `学習内容を設定しました。\n\n` +
    `学年：高校${grade}\n` +
    `教科：${subject}\n` +
    `単元：${unit}\n\n` +
    `これからこの内容を前提にサポートします。`
  );

}


/* =========================
   CHAT
========================= */

function handleEnter(event){

  if(event.key === "Enter"){

    sendMessage();

  }

}


function addUserMessage(text){

  const chat =
    document.getElementById(
      "chatMessages"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "bubble user";

  div.textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


function addAIMessage(text){

  const chat =
    document.getElementById(
      "chatMessages"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "bubble ai";

  div.textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if(!text){

    return;
  }

  addUserMessage(text);

  input.value = "";

  addAIMessage(
    "SCが考えています..."
  );

  try{

    console.log(
      "SC API:",
      `${WORKER_URL}/api/chat`
    );

    const response =
      await fetch(
        `${WORKER_URL}/api/chat`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: text,

              studyContent: {
                grade:
                  studyContent.grade,

                subject:
                  studyContent.subject,

                unit:
                  studyContent.unit
              }
            })
        }
      );

    const data =
      await response.json();

    const messages =
      document.querySelectorAll(
        ".bubble.ai"
      );

    const last =
      messages[
        messages.length - 1
      ];

    if(last){

      last.remove();

    }

    if(!response.ok){

      console.error(
        "Worker error:",
        data
      );

      addAIMessage(
        data.error ||
        "SCとの接続でエラーが起きました。"
      );

      return;
    }

    addAIMessage(
      data.answer ||
      "回答を受け取れませんでした。"
    );

  }catch(error){

    console.error(
      "SC CONNECTION ERROR:",
      error
    );

    const messages =
      document.querySelectorAll(
        ".bubble.ai"
      );

    const last =
      messages[
        messages.length - 1
      ];

    if(last){

      last.remove();

    }

    addAIMessage(
      "SCとの接続に失敗しました。WorkerのURLまたはCORS設定を確認してください。"
    );

  }

}


/* =========================
   IMAGE
========================= */

async function analyzeImage(event){

  const file =
    event.target.files[0];

  if(!file){

    return;
  }

  addUserMessage(
    "📷 問題の写真を送信しました。"
  );

  addAIMessage(
    "SCが問題を分析しています..."
  );

  try{

    const base64 =
      await fileToBase64(file);

    const response =
      await fetch(
        `${WORKER_URL}/api/analyze`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              image: base64,

              studyContent: {
                grade:
                  studyContent.grade,

                subject:
                  studyContent.subject,

                unit:
                  studyContent.unit
              }
            })
        }
      );

    const data =
      await response.json();

    const messages =
      document.querySelectorAll(
        ".bubble.ai"
      );

    const last =
      messages[
        messages.length - 1
      ];

    if(last){

      last.remove();

    }

    addAIMessage(
      data.answer ||
      data.error ||
      "画像を分析できませんでした。"
    );

  }catch(error){

    console.error(
      "IMAGE ERROR:",
      error
    );

    addAIMessage(
      "画像分析でエラーが発生しました。"
    );

  }

  event.target.value = "";

}


function fileToBase64(file){

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () =>
        resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   TIMER
========================= */

let timerSeconds = 0;
let timerTotal = 0;
let timerInterval = null;
let timerRunning = false;


function formatTime(seconds){

  const h =
    Math.floor(
      seconds / 3600
    );

  const m =
    Math.floor(
      (seconds % 3600) / 60
    );

  const s =
    seconds % 60;

  return [
    h,
    m,
    s
  ]
  .map(
    value =>
    String(value)
      .padStart(2, "0")
  )
  .join(":");

}


function updateTimer(){

  document
    .getElementById("timerDisplay")
    .textContent =
    formatTime(
      timerSeconds
    );

  let progress = 0;

  if(timerTotal > 0){

    progress =
      (
        (timerTotal -
        timerSeconds)
        /
        timerTotal
      ) * 100;

  }

  document
    .getElementById("timerGaugeBar")
    .style.width =
    `${progress}%`;

  const studied =
    Math.max(
      timerTotal -
      timerSeconds,
      0
    );

  document
    .getElementById("todayTime")
    .textContent =
    `${Math.floor(
      studied / 60
    )}分`;

}


function startTimer(){

  if(timerRunning){

    return;
  }

  if(timerSeconds <= 0){

    const minutes =
      Number(
        document
          .getElementById(
            "timerMinutes"
          )
          .value
      );

    if(
      !minutes ||
      minutes <= 0
    ){

      alert(
        "勉強したい時間を入力してください。"
      );

      return;
    }

    if(minutes > 600){

      alert(
        "最大600分まで設定できます。"
      );

      return;
    }

    timerTotal =
      minutes * 60;

    timerSeconds =
      timerTotal;

  }

  timerRunning = true;

  document
    .getElementById("timerStart")
    .textContent =
    "RUNNING";

  timerInterval =
    setInterval(
      () => {

        timerSeconds--;

        updateTimer();

        if(
          timerSeconds <= 0
        ){

          finishTimer();

        }

      },
      1000
    );

}


function pauseTimer(){

  if(!timerRunning){

    return;
  }

  clearInterval(
    timerInterval
  );

  timerRunning = false;

  document
    .getElementById("timerStart")
    .textContent =
    "START";

}


function resetTimer(){

  clearInterval(
    timerInterval
  );

  timerRunning = false;

  timerSeconds = 0;
  timerTotal = 0;

  document
    .getElementById("timerStart")
    .textContent =
    "START";

  document
    .getElementById("timerGaugeBar")
    .style.width =
    "0%";

  updateTimer();

}


function finishTimer(){

  clearInterval(
    timerInterval
  );

  timerRunning = false;

  document
    .getElementById("timerStart")
    .textContent =
    "START";

  const sessions =
    Number(
      document
        .getElementById(
          "sessionCount"
        )
        .textContent
    );

  document
    .getElementById(
      "sessionCount"
    )
    .textContent =
    sessions + 1;

  alert(
    "設定した学習時間が終了しました！"
  );

}


/* =========================
   START
========================= */

function startApp(){

  updateTimer();

  const savedContent =
    localStorage.getItem(
      "studyCoachContent"
    );

  if(savedContent){

    try{

      studyContent =
        JSON.parse(
          savedContent
        );

      document
        .getElementById(
          "studyGrade"
        )
        .value =
        studyContent.grade;

      document
        .getElementById(
          "studySubject"
        )
        .value =
        studyContent.subject;

      document
        .getElementById(
          "studyUnit"
        )
        .value =
        studyContent.unit;

      if(
        studyContent.subject &&
        studyContent.unit
      ){

        document
          .getElementById(
            "currentMode"
          )
          .textContent =
          `${studyContent.subject}モード`;

        document
          .getElementById(
            "currentSubject"
          )
          .textContent =
          `${studyContent.subject} / ${studyContent.unit}`;

        document
          .getElementById(
            "studyContentStatus"
          )
          .textContent =
          `SC設定済み：高校${studyContent.grade}・${studyContent.subject}・${studyContent.unit}`;

      }

    }catch(error){

      console.error(
        "Study content error:",
        error
      );

    }

  }

  const loggedIn =
    localStorage.getItem(
      "studyCoachLoggedIn"
    );

  if(
    loggedIn === "true" ||
    loggedIn === "guest"
  ){

    document
      .getElementById(
        "authScreen"
      )
      .classList.add(
        "hidden"
      );

    loadUser();

  }else{

    document
      .getElementById(
        "authScreen"
      )
      .classList.remove(
        "hidden"
      );

  }

}


document.addEventListener(
  "DOMContentLoaded",
  startApp
);

</script>
