<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SC | Study Coach</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#f7f8fa;
  color:#202124;
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* =========================
   HEADER
========================= */

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 28px;

  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo span{
  color:#5875e8;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.userName{
  font-size:13px;
  color:#6b7280;
}

.logoutButton{
  border:1px solid #e1e4e8;
  background:#fff;
  color:#555;

  padding:7px 11px;
  border-radius:8px;

  font-size:12px;
}

.logoutButton:hover{
  background:#f5f6f8;
}

/* =========================
   LAYOUT
========================= */

.app{
  max-width:1400px;
  margin:auto;
  padding:30px;
}

.pageTitle{
  margin-bottom:24px;
}

.pageTitle h1{
  font-size:28px;
  font-weight:750;
  margin-bottom:6px;
}

.pageTitle p{
  color:#7b8190;
  font-size:14px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
}

.cardTitle{
  font-size:15px;
  font-weight:750;
  margin-bottom:16px;
}

/* =========================
   SC CHAT
========================= */

.scTop{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding-bottom:16px;
  border-bottom:1px solid #edf0f3;
}

.scTitle{
  display:flex;
  align-items:center;
  gap:11px;
}

.scIcon{
  width:40px;
  height:40px;

  border-radius:10px;

  background:#eef2ff;
  color:#5875e8;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:900;
  font-size:15px;
}

.scName{
  font-size:15px;
  font-weight:800;
}

.scStatus{
  color:#8a909d;
  font-size:11px;
  margin-top:2px;
}

.mode{
  font-size:11px;
  color:#5875e8;
  background:#eef2ff;
  padding:6px 9px;
  border-radius:7px;
}

.chat{
  height:390px;
  overflow-y:auto;
  padding:18px 2px;
}

.bubble{
  max-width:78%;
  padding:11px 14px;

  border-radius:12px;

  margin-bottom:10px;

  line-height:1.6;
  font-size:14px;

  white-space:pre-wrap;
}

.bubble.ai{
  background:#f3f4f6;
  color:#30343b;
}

.bubble.user{
  margin-left:auto;
  background:#5875e8;
  color:white;
}

.chatInput{
  display:flex;
  gap:8px;
}

.chatInput input{
  flex:1;

  min-width:0;

  border:1px solid #dfe3e8;
  border-radius:9px;

  padding:12px 13px;

  outline:none;
  background:#fff;
}

.chatInput input:focus{
  border-color:#5875e8;
}

.primaryButton{
  border:0;
  background:#5875e8;
  color:#fff;

  border-radius:9px;
  padding:0 18px;

  font-weight:700;
}

.primaryButton:hover{
  background:#4e6bd7;
}

.toolRow{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.secondaryButton{
  border:1px solid #dfe3e8;
  background:#fff;
  color:#50555e;

  border-radius:8px;
  padding:9px 12px;

  font-size:12px;
}

.secondaryButton:hover{
  background:#f7f8fa;
}

.upload{
  position:relative;
  overflow:hidden;
}

.upload input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

/* =========================
   GRADE
========================= */

.gradeButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:18px;
}

.gradeButton{
  border:1px solid #dfe3e8;
  background:#fff;
  color:#5c626c;

  border-radius:9px;
  padding:10px;
}

.gradeButton.active{
  background:#5875e8;
  border-color:#5875e8;
  color:#fff;
}

.subjectGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.subjectButton{
  text-align:left;

  border:1px solid #e4e7eb;
  background:#fff;

  border-radius:9px;
  padding:12px;

  color:#424750;
}

.subjectButton:hover{
  border-color:#5875e8;
  background:#fafbff;
}

.subjectName{
  font-weight:700;
  font-size:13px;
}

.unitName{
  color:#8a909b;
  font-size:11px;
  margin-top:4px;
}

/* =========================
   TIMER
========================= */

.timerDisplay{
  text-align:center;

  font-size:40px;
  font-weight:800;

  letter-spacing:2px;

  margin:12px 0 18px;
}

.timerSettings{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}

.timerSettings input{
  flex:1;

  border:1px solid #dfe3e8;
  border-radius:8px;

  padding:10px;

  text-align:center;
}

.timerSettings span{
  display:flex;
  align-items:center;
  color:#777;
  font-size:12px;
}

.timerActions{
  display:flex;
  gap:7px;
}

.timerActions button{
  flex:1;
  padding:10px;
}

.timerGauge{
  height:8px;
  background:#edf0f3;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.timerGaugeBar{
  height:100%;
  width:0%;

  background:#5875e8;

  transition:width .4s;
}

/* =========================
   STATS
========================= */

.stat{
  padding:13px 0;
  border-bottom:1px solid #edf0f3;
}

.stat:last-child{
  border-bottom:0;
}

.statLabel{
  font-size:11px;
  color:#858b96;
}

.statValue{
  font-size:20px;
  font-weight:800;
  margin-top:3px;
}

/* =========================
   MODAL
========================= */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(20,24,31,.45);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;
}

.modal{
  width:min(470px,100%);

  max-height:90vh;
  overflow-y:auto;

  background:#fff;

  border-radius:16px;
  padding:26px;

  box-shadow:0 20px 70px rgba(0,0,0,.2);
}

.modal h2{
  font-size:22px;
  margin-bottom:7px;
}

.modalDescription{
  color:#777f8c;
  font-size:13px;
  line-height:1.6;
  margin-bottom:20px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;

  font-size:12px;
  color:#5f6671;

  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;

  border:1px solid #dfe3e8;
  background:#fff;

  border-radius:9px;

  padding:11px 12px;

  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:#5875e8;
}

.check{
  display:flex;
  align-items:flex-start;
  gap:8px;

  color:#626975;

  font-size:11px;
  line-height:1.55;

  margin:11px 0;
}

.check input{
  margin-top:3px;
}

.modalActions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.modalActions button{
  flex:1;
  height:42px;
}

.textButton{
  display:block;

  margin:15px auto 0;

  border:0;
  background:none;

  color:#5875e8;

  font-size:12px;
}

/* =========================
   GUEST
========================= */

.guestButton{
  width:100%;
  margin-top:8px;

  height:42px;

  border:1px solid #dfe3e8;
  background:#fff;

  color:#555;

  border-radius:9px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .app{
    padding:18px;
  }

  .layout{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{
    padding:0 15px;
  }

  .userName{
    display:none;
  }

  .app{
    padding:14px;
  }

  .pageTitle h1{
    font-size:23px;
  }

  .chat{
    height:340px;
  }

  .bubble{
    max-width:90%;
  }

  .chatInput{
    flex-direction:column;
  }

  .primaryButton{
    height:42px;
  }

  .subjectGrid{
    grid-template-columns:1fr;
  }

  .timerDisplay{
    font-size:34px;
  }
}
</style>
</head>


<body>


<header>

  <div class="logo">
    SC <span>/ Study Coach</span>
  </div>

  <div class="headerRight">

    <div
      class="userName"
      id="headerUserName"
    ></div>

    <button
      class="logoutButton"
      onclick="logout()"
    >
      ログアウト
    </button>

  </div>

</header>


<main class="app">


  <div class="pageTitle">

    <h1>学習ダッシュボード</h1>

    <p id="welcomeText">
      SCと一緒に今日の学習を進めましょう。
    </p>

  </div>


  <div class="layout">


    <!-- =====================
         LEFT
    ====================== -->

    <section>


      <div class="card">

        <div class="scTop">

          <div class="scTitle">

            <div class="scIcon">
              SC
            </div>

            <div>

              <div class="scName">
                Study Coach
              </div>

              <div class="scStatus">
                AI Learning Assistant
              </div>

            </div>

          </div>


          <div
            class="mode"
            id="currentMode"
          >
            通常モード
          </div>

        </div>


        <div
          class="chat"
          id="chatMessages"
        >

          <div class="bubble ai">

            こんにちは。SCです。

            分からない問題を文章で質問したり、
            問題の写真を送って質問できます。

            教科や単元を選ぶと、
            その内容に合わせてサポートします。

          </div>

        </div>


        <div class="chatInput">

          <input
            id="messageInput"
            placeholder="SCに質問する..."
            onkeydown="handleEnter(event)"
          >

          <button
            class="primaryButton"
            onclick="sendMessage()"
          >
            送信
          </button>

        </div>


        <div class="toolRow">

          <label class="secondaryButton upload">

            📷 問題写真を送る

            <input
              type="file"
              id="imageInput"
              accept="image/*"
              onchange="analyzeImage(event)"
            >

          </label>

        </div>

      </div>


      <!-- 学年・単元 -->

      <div
        class="card"
        style="margin-top:18px;"
      >

        <div class="cardTitle">
          学年・学習単元
        </div>


        <div class="gradeButtons">

          <button
            class="gradeButton active"
            onclick="selectGrade(1,this)"
          >
            高1
          </button>

          <button
            class="gradeButton"
            onclick="selectGrade(2,this)"
          >
            高2
          </button>

          <button
            class="gradeButton"
            onclick="selectGrade(3,this)"
          >
            高3
          </button>

        </div>


        <div
          class="subjectGrid"
          id="subjects"
        ></div>

      </div>


    </section>


    <!-- =====================
         RIGHT
    ====================== -->

    <aside>


      <!-- TIMER -->

      <div class="card">

        <div class="cardTitle">
          学習タイマー
        </div>


        <div
          class="timerDisplay"
          id="timerDisplay"
        >
          00:00:00
        </div>


        <div class="timerSettings">

          <input
            id="timerMinutes"
            type="number"
            min="1"
            max="600"
            placeholder="時間"
          >

          <span>分</span>

        </div>


        <div class="timerGauge">

          <div
            class="timerGaugeBar"
            id="timerGaugeBar"
          ></div>

        </div>


        <div class="timerActions">

          <button
            class="primaryButton"
            onclick="startTimer()"
            id="timerStart"
          >
            START
          </button>

          <button
            class="secondaryButton"
            onclick="pauseTimer()"
          >
            PAUSE
          </button>

          <button
            class="secondaryButton"
            onclick="resetTimer()"
          >
            RESET
          </button>

        </div>

      </div>


      <!-- DATA -->

      <div
        class="card"
        style="margin-top:18px;"
      >

        <div class="cardTitle">
          今日の学習データ
        </div>


        <div class="stat">

          <div class="statLabel">
            学習時間
          </div>

          <div
            class="statValue"
            id="todayTime"
          >
            0分
          </div>

        </div>


        <div class="stat">

          <div class="statLabel">
            現在の単元
          </div>

          <div
            class="statValue"
            id="currentSubject"
            style="font-size:15px;"
          >
            未選択
          </div>

        </div>


        <div class="stat">

          <div class="statLabel">
            学習セッション
          </div>

          <div
            class="statValue"
            id="sessionCount"
          >
            0
          </div>

        </div>

      </div>


    </aside>


  </div>

</main>


<!-- =====================
     AUTH
====================== -->

<div
  class="overlay"
  id="authScreen"
>

  <div class="modal">


    <h2 id="authTitle">
      Study Coachへようこそ
    </h2>


    <div
      class="modalDescription"
      id="authDescription"
    >
      アカウントを作成すると学習データを保存できます。
    </div>


    <!-- REGISTER -->

    <div id="registerForm">


      <div class="field">

        <label>
          ニックネーム
        </label>

        <input
          id="registerName"
          type="text"
          maxlength="30"
          placeholder="例：太郎"
        >

      </div>


      <div class="field">

        <label>
          メールアドレス
        </label>

        <input
          id="registerEmail"
          type="email"
          placeholder="example@mail.com"
        >

      </div>


      <div class="field">

        <label>
          年齢
        </label>

        <input
          id="registerAge"
          type="number"
          min="13"
          max="18"
          placeholder="例：16"
        >

      </div>


      <div class="field">

        <label>
          学年
        </label>

        <select id="registerGrade">

          <option value="1">
            高校1年
          </option>

          <option value="2">
            高校2年
          </option>

          <option value="3">
            高校3年
          </option>

        </select>

      </div>


      <label class="check">

        <input
          type="checkbox"
          id="termsCheck"
        >

        <span>
          利用規約を確認し、サービスの利用条件に同意します。
        </span>

      </label>


      <label class="check">

        <input
          type="checkbox"
          id="privacyCheck"
        >

        <span>
          個人情報の利用目的・取り扱いについて確認しました。
        </span>

      </label>


      <label class="check">

        <input
          type="checkbox"
          id="aiDataCheck"
        >

        <span>
          年齢・学年・質問内容などを、
          学習傾向の分析やサービス改善に
          利用することに同意します。
        </span>

      </label>


      <div class="modalActions">

        <button
          class="primaryButton"
          onclick="register()"
        >
          アカウント作成
        </button>

        <button
          class="secondaryButton"
          onclick="showLogin()"
        >
          ログイン
        </button>

      </div>


      <button
        class="guestButton"
        onclick="guestLogin()"
      >
        ゲストとして使用
      </button>


    </div>


    <!-- LOGIN -->

    <div
      id="loginForm"
      class="hidden"
    >

      <div class="field">

        <label>
          メールアドレス
        </label>

        <input
          id="loginEmail"
          type="email"
          placeholder="example@mail.com"
        >

      </div>


      <div class="modalActions">

        <button
          class="primaryButton"
          onclick="login()"
        >
          ログインコードを送信
        </button>

        <button
          class="secondaryButton"
          onclick="showRegister()"
        >
          戻る
        </button>

      </div>


      <button
        class="guestButton"
        onclick="guestLogin()"
      >
        ゲストとして使用
      </button>

    </div>


    <!-- VERIFY -->

    <div
      id="verifyForm"
      class="hidden"
    >

      <div class="field">

        <label>
          認証コード
        </label>

        <input
          id="verifyCodeInput"
          type="text"
          inputmode="numeric"
          maxlength="6"
          placeholder="6桁のコード"
        >

      </div>


      <div class="modalActions">

        <button
          class="primaryButton"
          onclick="verifyLoginCode()"
        >
          認証する
        </button>

      </div>

    </div>


  </div>

</div>


<script>

/* =========================
   DATA
========================= */

const subjects = {

  1:[
    ["数学","数と式"],
    ["数学","二次関数"],
    ["英語","英文法"],
    ["英語","長文読解"],
    ["国語","現代文"],
    ["国語","古文"],
    ["物理","力学"],
    ["化学","物質量"],
    ["地理","地図と統計"]
  ],

  2:[
    ["数学","微分積分"],
    ["数学","数列"],
    ["英語","英文解釈"],
    ["英語","長文読解"],
    ["国語","古文"],
    ["物理","電磁気"],
    ["化学","化学平衡"],
    ["日本史","近世史"],
    ["世界史","近代史"]
  ],

  3:[
    ["数学","数学III"],
    ["数学","複素数平面"],
    ["英語","入試長文"],
    ["英語","英作文"],
    ["国語","入試現代文"],
    ["物理","入試物理"],
    ["化学","入試化学"],
    ["日本史","テーマ史"],
    ["世界史","テーマ史"]
  ]

};


let currentGrade = 1;
let currentMode = "通常モード";


/* =========================
   AUTH
========================= */

function showLogin(){

  document
    .getElementById("registerForm")
    .classList.add("hidden");

  document
    .getElementById("verifyForm")
    .classList.add("hidden");

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

  document
    .getElementById("authTitle")
    .textContent =
    "ログイン";

}


function showRegister(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("verifyForm")
    .classList.add("hidden");

  document
    .getElementById("registerForm")
    .classList.remove("hidden");

  document
    .getElementById("authTitle")
    .textContent =
    "Study Coachへようこそ";

}


function guestLogin(){

  localStorage.setItem(
    "studyCoachLoggedIn",
    "guest"
  );

  localStorage.setItem(
    "studyCoachName",
    "ゲスト"
  );

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  loadUser();

}


async function register(){

  const name =
    document
    .getElementById("registerName")
    .value.trim();

  const email =
    document
    .getElementById("registerEmail")
    .value.trim();

  const age =
    Number(
      document
      .getElementById("registerAge")
      .value
    );

  const grade =
    document
    .getElementById("registerGrade")
    .value;


  if(!name || !email || !age){

    alert(
      "名前・メールアドレス・年齢を入力してください。"
    );

    return;

  }


  const checks = [
    "termsCheck",
    "privacyCheck",
    "aiDataCheck"
  ];


  if(
    !checks.every(
      id =>
      document.getElementById(id).checked
    )
  ){

    alert(
      "3つすべての同意が必要です。"
    );

    return;

  }


  try{

    const response =
      await fetch(
        "/api/register",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            name,
            email,
            age,
            grade
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      alert(
        data.error ||
        "アカウント作成に失敗しました。"
      );

      return;

    }


    localStorage.setItem(
      "pendingEmail",
      email
    );

    localStorage.setItem(
      "studyCoachName",
      name
    );


    document
      .getElementById("registerForm")
      .classList.add("hidden");

    document
      .getElementById("verifyForm")
      .classList.remove("hidden");

    document
      .getElementById("authTitle")
      .textContent =
      "メール認証";


    alert(
      "認証コードを送信しました。"
    );


  }catch(error){

    console.error(error);

    alert(
      "サーバーに接続できませんでした。"
    );

  }

}


async function login(){

  const email =
    document
    .getElementById("loginEmail")
    .value.trim();


  if(!email){

    alert(
      "メールアドレスを入力してください。"
    );

    return;

  }


  try{

    const response =
      await fetch(
        "/api/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      alert(
        data.error ||
        "ログインコードを送信できませんでした。"
      );

      return;

    }


    localStorage.setItem(
      "pendingEmail",
      email
    );


    document
      .getElementById("loginForm")
      .classList.add("hidden");

    document
      .getElementById("verifyForm")
      .classList.remove("hidden");

    document
      .getElementById("authTitle")
      .textContent =
      "ログイン認証";


    alert(
      "ログインコードを送信しました。"
    );


  }catch(error){

    console.error(error);

    alert(
      "サーバーに接続できませんでした。"
    );

  }

}


async function verifyLoginCode(){

  const email =
    localStorage.getItem(
      "pendingEmail"
    );

  const code =
    document
    .getElementById("verifyCodeInput")
    .value.trim();


  if(!email || !code){

    alert(
      "認証コードを入力してください。"
    );

    return;

  }


  try{

    const response =
      await fetch(
        "/api/verify",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email,
            code
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      alert(
        data.error ||
        "認証に失敗しました。"
      );

      return;

    }


    localStorage.setItem(
      "studyCoachLoggedIn",
      "true"
    );


    localStorage.removeItem(
      "pendingEmail"
    );


    document
      .getElementById("authScreen")
      .classList.add("hidden");


    loadUser();


  }catch(error){

    console.error(error);

    alert(
      "認証サーバーに接続できませんでした。"
    );

  }

}


function logout(){

  localStorage.removeItem(
    "studyCoachLoggedIn"
  );

  location.reload();

}


/* =========================
   USER
========================= */

function loadUser(){

  const name =
    localStorage.getItem(
      "studyCoachName"
    ) ||
    "ゲスト";


  document
    .getElementById("headerUserName")
    .textContent =
    name;


  document
    .getElementById("welcomeText")
    .textContent =
    `${name}さん、今日の学習を始めましょう。`;

}


/* =========================
   GRADE
========================= */

function selectGrade(
  grade,
  button
){

  currentGrade = grade;


  document
    .querySelectorAll(".gradeButton")
    .forEach(
      element =>
      element.classList.remove("active")
    );


  button.classList.add("active");


  renderSubjects();

}


function renderSubjects(){

  const container =
    document.getElementById(
      "subjects"
    );


  container.innerHTML = "";


  subjects[currentGrade]
    .forEach(
      ([subject,unit]) => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "subjectButton";


        button.innerHTML = `
          <div class="subjectName">
            ${subject}
          </div>

          <div class="unitName">
            ${unit}
          </div>
        `;


        button.onclick =
          () =>
          selectUnit(
            subject,
            unit
          );


        container.appendChild(
          button
        );

      }
    );

}


function selectUnit(
  subject,
  unit
){

  currentMode =
    `${subject}・${unit}モード`;


  document
    .getElementById(
      "currentMode"
    )
    .textContent =
    currentMode;


  document
    .getElementById(
      "currentSubject"
    )
    .textContent =
    `${subject} / ${unit}`;


  addAIMessage(
    `SCの${subject}「${unit}」モードに切り替えました。\nこの単元について質問してください。`
  );

}


/* =========================
   CHAT
========================= */

function handleEnter(event){

  if(event.key === "Enter"){

    sendMessage();

  }

}


function addUserMessage(text){

  const chat =
    document.getElementById(
      "chatMessages"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "bubble user";


  div.textContent =
    text;


  chat.appendChild(div);


  chat.scrollTop =
    chat.scrollHeight;

}


function addAIMessage(text){

  const chat =
    document.getElementById(
      "chatMessages"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "bubble ai";


  div.textContent =
    text;


  chat.appendChild(div);


  chat.scrollTop =
    chat.scrollHeight;

}


async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  addUserMessage(text);


  input.value = "";


  addAIMessage(
    "SCが考えています..."
  );


  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:text,
            grade:currentGrade,
            mode:currentMode
          })
        }
      );


    const data =
      await response.json();


    const messages =
      document.querySelectorAll(
        ".bubble.ai"
      );


    const last =
      messages[
        messages.length - 1
      ];


    if(last){

      last.remove();

    }


    if(!response.ok){

      addAIMessage(
        "SCとの接続でエラーが起きました。"
      );

      return;

    }


    addAIMessage(
      data.answer ||
      "回答を受け取れませんでした。"
    );


  }catch(error){

    console.error(error);


    const messages =
      document.querySelectorAll(
        ".bubble.ai"
      );


    const last =
      messages[
        messages.length - 1
      ];


    if(last){

      last.remove();

    }


    addAIMessage(
      "SCとの接続に失敗しました。"
    );

  }

}


/* =========================
   IMAGE
========================= */

async function analyzeImage(event){

  const file =
    event.target.files[0];


  if(!file){

    return;

  }


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    alert(
      "画像ファイルを選択してください。"
    );

    return;

  }


  addUserMessage(
    "📷 問題の写真を送信しました。"
  );


  addAIMessage(
    "SCが問題を分析しています..."
  );


  try{

    const base64 =
      await fileToBase64(
        file
      );


    const response =
      await fetch(
        "/api/analyze",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            image:base64,

            grade:currentGrade,

            mode:currentMode

          })
        }
      );


    const data =
      await response.json();


    const messages =
      document.querySelectorAll(
        ".bubble.ai"
      );


    const last =
      messages[
        messages.length - 1
      ];


    if(last){

      last.remove();

    }


    addAIMessage(
      data.answer ||
      "画像を分析できませんでした。"
    );


  }catch(error){

    console.error(error);


    addAIMessage(
      "画像分析でエラーが発生しました。"
    );

  }


  event.target.value = "";

}


function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload =
        () =>
        resolve(
          reader.result
        );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   COUNTDOWN TIMER
========================= */

let timerSeconds = 0;
let timerTotal = 0;
let timerInterval = null;
let timerRunning = false;


function formatTime(
  totalSeconds
){

  const hours =
    Math.floor(
      totalSeconds / 3600
    );


  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );


  const seconds =
    totalSeconds % 60;


  return [
    hours,
    minutes,
    seconds
  ]
  .map(
    value =>
    String(value).padStart(
      2,
      "0"
    )
  )
  .join(":");

}


function updateTimer(){

  document
    .getElementById(
      "timerDisplay"
    )
    .textContent =
    formatTime(
      timerSeconds
    );


  let progress = 0;


  if(timerTotal > 0){

    progress =
      ((timerTotal - timerSeconds)
      / timerTotal) * 100;

  }


  document
    .getElementById(
      "timerGaugeBar"
    )
    .style.width =
    Math.min(
      Math.max(progress,0),
      100
    ) + "%";


  const studied =
    timerTotal -
    timerSeconds;


  document
    .getElementById(
      "todayTime"
    )
    .textContent =
    Math.floor(
      Math.max(studied,0) / 60
    ) + "分";

}


function startTimer(){

  if(timerRunning){

    return;

  }


  if(timerSeconds <= 0){

    const minutes =
      Number(
        document
        .getElementById(
          "timerMinutes"
        )
        .value
      );


    if(
      !minutes ||
      minutes <= 0
    ){

      alert(
        "まず設定時間を入力してください。"
      );

      return;

    }


    timerTotal =
      minutes * 60;

    timerSeconds =
      timerTotal;

  }


  timerRunning = true;


  document
    .getElementById(
      "timerStart"
    )
    .textContent =
    "RUNNING";


  timerInterval =
    setInterval(
      () => {

        timerSeconds--;

        updateTimer();


        if(timerSeconds <= 0){

          finishTimer();

        }

      },
      1000
    );

}


function pauseTimer(){

  if(!timerRunning){

    return;

  }


  clearInterval(
    timerInterval
  );


  timerRunning = false;


  document
    .getElementById(
      "timerStart"
    )
    .textContent =
    "START";

}


function resetTimer(){

  clearInterval(
    timerInterval
  );


  timerRunning = false;


  timerSeconds = 0;
  timerTotal = 0;


  document
    .getElementById(
      "timerStart"
    )
    .textContent =
    "START";


  document
    .getElementById(
      "timerGaugeBar"
    )
    .style.width =
    "0%";


  updateTimer();

}


function finishTimer(){

  clearInterval(
    timerInterval
  );


  timerRunning = false;


  document
    .getElementById(
      "timerStart"
    )
    .textContent =
    "START";


  document
    .getElementById(
      "sessionCount"
    )
    .textContent =
    Number(
      document
      .getElementById(
        "sessionCount"
      )
      .textContent
    ) + 1;


  alert(
    "設定した学習時間が終了しました！"
  );

}


/* =========================
   START
========================= */

function startApp(){

  renderSubjects();

  updateTimer();


  const loginState =
    localStorage.getItem(
      "studyCoachLoggedIn"
    );


  if(
    loginState === "true" ||
    loginState === "guest"
  ){

    document
      .getElementById(
        "authScreen"
      )
      .classList.add(
        "hidden"
      );


    loadUser();

  }else{

    document
      .getElementById(
        "authScreen"
      )
      .classList.remove(
        "hidden"
      );

  }

}


document.addEventListener(
  "DOMContentLoaded",
  startApp
);
